<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Staring at the Wall</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@500;700&family=IBM+Plex+Mono:ital,wght@0,400;0,500;0,600;1,400&family=Special+Elite&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background-color: #000000;
      color: #e5e5e5;
      font-family: 'IBM Plex Mono', monospace;
      overflow: hidden;
      user-select: none;
      touch-action: none;
    }
    .handwriting {
      font-family: 'Caveat', cursive;
    }
    .stamp-font {
      font-family: 'Special Elite', monospace;
    }
    .wall-viewport {
      touch-action: none;
      cursor: grab;
    }
    .wall-viewport.panning {
      cursor: grabbing;
    }

    /* Sticky Paper Styling */
    .note-wrapper {
      perspective: 1000px;
      touch-action: none;
    }
    .sticky-note {
      position: relative;
      width: 100%;
      height: 100%;
      transition: box-shadow 0.2s ease, opacity 0.3s ease;
      transform-style: preserve-3d;
      box-shadow: 3px 6px 18px rgba(0, 0, 0, 0.8), 0 1px 3px rgba(0,0,0,0.6);
    }
    .note-wrapper:hover .sticky-note {
      box-shadow: 6px 18px 32px rgba(0, 0, 0, 0.95);
      z-index: 500 !important;
    }
    .note-wrapper.dragging .sticky-note {
      opacity: 0.92;
      cursor: grabbing !important;
      transform: scale(1.04) rotate(0deg) !important;
      box-shadow: 14px 28px 45px rgba(0, 0, 0, 0.98);
      z-index: 9999 !important;
    }

    /* Face-down flip effect */
    .sticky-note.is-facedown {
      transform: rotateY(180deg) !important;
    }
    .note-front, .note-back {
      backface-visibility: hidden;
      -webkit-backface-visibility: hidden;
    }
    .note-back {
      transform: rotateY(180deg);
      background-image: repeating-linear-gradient(45deg, rgba(0,0,0,0.04) 0, rgba(0,0,0,0.04) 2px, transparent 0, transparent 8px);
    }

    .folded-corner {
      position: absolute;
      bottom: 0;
      right: 0;
      width: 0;
      height: 0;
      border-style: solid;
      border-width: 0 0 20px 20px;
      border-color: transparent transparent #000000 transparent;
      opacity: 0.25;
      cursor: pointer;
      transition: border-width 0.15s ease, opacity 0.15s ease;
    }
    .sticky-note.folded .folded-corner {
      border-width: 0 0 32px 32px;
      opacity: 0.55;
    }

    /* Ink Rubber Stamp */
    .ink-stamp {
      letter-spacing: 1px;
      border-width: 2px;
      display: inline-block;
      text-transform: uppercase;
      opacity: 0.9;
      mix-blend-mode: multiply;
      pointer-events: none;
      animation: stampDrop 0.14s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    @keyframes stampDrop {
      0% { transform: scale(1.7) rotate(var(--rot)); opacity: 0; }
      100% { transform: scale(1) rotate(var(--rot)); opacity: 0.9; }
    }

    @keyframes crumple {
      0% { transform: scale(1) rotate(0deg); opacity: 1; }
      50% { transform: scale(0.6) rotate(25deg); opacity: 0.6; filter: contrast(180%); }
      100% { transform: scale(0) rotate(90deg); opacity: 0; margin-top: 80px; }
    }
    .crumpling {
      animation: crumple 0.35s forwards cubic-bezier(0.6, -0.28, 0.735, 0.045) !important;
      pointer-events: none;
    }

    /* Minimap Radar */
    #radarMap {
      box-shadow: 0 8px 30px rgba(0, 0, 0, 0.9), 0 0 0 1px rgba(255, 255, 255, 0.12);
      backdrop-filter: blur(10px);
      touch-action: none;
    }
    .radar-blip {
      position: absolute;
      width: 4px;
      height: 4px;
      border-radius: 50%;
      transform: translate(-50%, -50%);
      pointer-events: none;
    }
    .radar-camera-box {
      position: absolute;
      border: 1.5px solid rgba(255, 255, 255, 0.65);
      background: rgba(255, 255, 255, 0.08);
      pointer-events: none;
    }

    /* Doodle canvas */
    #doodleCanvas {
      touch-action: none;
      cursor: crosshair;
    }
  </style>
</head>

<body class="w-screen h-screen bg-black text-neutral-300 flex flex-col overflow-hidden">

  <header class="min-h-[56px] border-b border-neutral-900 px-3 sm:px-5 flex flex-wrap items-center justify-between gap-2 bg-black/95 z-50 select-none py-1.5 sm:py-0">

        />
        <span id="charCount" class="absolute right-2 top-2 text-[10px] text-neutral-600 pointer-events-none hidden md:inline">240</span>
      </div>

      <!-- Mode Toggle: Text or Ink Doodle -->

        type="button" 
        id="toggleDoodleModalBtn"

        <span>✏️</span>

      <!-- Submit button -->

        class="bg-neutral-100 hover:bg-white text-black text-xs font-semibold px-3 py-1.5 rounded active:scale-95 transition shrink-0 disabled:bg-neutral-800 disabled:text-neutral-500 disabled:cursor-not-allowed"

        <span id="submitBtnText">Stick</span>
      </button>
    </form>

    <!-- Toolbar controls -->
    <div class="order-2 sm:order-3 flex items-center gap-1.5 shrink-0">
      <!-- Search filter toggle -->
      <div class="relative">
        <input 
          id="filterInput" 
          type="text" 
          placeholder="Filter..." 
          class="w-20 focus:w-32 transition-all bg-neutral-950 border border-neutral-850 text-[11px] px-2 py-1 rounded text-neutral-200 focus:outline-none focus:border-neutral-600 font-mono placeholder-neutral-600"
        />
      </div>

      <!-- Drift Button -->
      <button 
        id="driftBtn" 
        title="Drift to a random note" 
        class="text-[11px] text-neutral-400 hover:text-white font-mono px-2 py-1 rounded border border-neutral-850 hover:border-neutral-700 transition"
      >
        drift
      </button>

      <!-- Mobile Radar Toggle -->
      <button 
        id="toggleRadarBtn" 
        title="Toggle Radar Map" 
        class="text-[11px] text-neutral-400 hover:text-white font-mono px-2 py-1 rounded border border-neutral-850 hover:border-neutral-700 transition"
      >
        map
      </button>

      <!-- Sound Toggle -->
      <button 
        id="audioToggleBtn" 
        title="Toggle paper sounds" 
        class="text-xs text-neutral-400 hover:text-white px-2 py-1 rounded transition border border-neutral-900"
      >
        <span id="audioIcon">🔊</span>
      </button>
    </div>
  </header>

  <main id="wallViewport" class="wall-viewport relative flex-1 w-full h-[calc(100vh-56px)] overflow-hidden bg-black select-none">
    <!-- Transform container (supports pan & zoom scaling) -->
    <div id="wallSurface" class="absolute top-0 left-0 w-[6000px] h-[6000px] pointer-events-auto origin-top-left">
      <!-- Micro Dot Grid pattern -->
      <div class="absolute inset-0 opacity-[0.035] pointer-events-none" style="background-image: radial-gradient(#ffffff 1px, transparent 1px); background-size: 40px 40px;"></div>
      <div id="notesContainer" class="relative w-full h-full"></div>
    </div>

    <!-- Empty Slate Message -->

      <p class="text-neutral-600 text-sm font-mono tracking-wide">The wall is blank.</p>
      <p class="text-neutral-700 text-xs mt-1">Leave a thought or sketch a doodle on the dark.</p>
    </div>

    <!-- On-screen Zoom Controls (Mobile & Desktop) -->
    <div class="absolute bottom-4 left-4 z-40 flex items-center bg-black/80 border border-neutral-800 rounded shadow-xl overflow-hidden backdrop-blur-md">
      <button id="zoomOutBtn" class="px-2.5 py-1.5 hover:bg-neutral-850 active:bg-neutral-800 text-neutral-300 font-mono text-sm border-r border-neutral-800">−</button>
      <button id="zoomResetBtn" class="px-2.5 py-1.5 hover:bg-neutral-850 active:bg-neutral-800 text-[11px] font-mono text-neutral-400 border-r border-neutral-800" title="Reset zoom & center">

      <button id="zoomInBtn" class="px-2.5 py-1.5 hover:bg-neutral-850 active:bg-neutral-800 text-neutral-300 font-mono text-sm">+</button>

      <div id="radarCamBox" class="radar-camera-box"></div>
      <div class="absolute top-1 left-2 flex items-center justify-between w-[calc(100%-16px)] pointer-events-none">
        <span class="text-[8px] text-neutral-500 font-mono tracking-wider">RADAR</span>

  <div id="doodleModal" class="fixed inset-0 bg-black/85 backdrop-blur-sm z-[100] hidden items-center justify-center p-4">

      </div>
    </div>
  </div>

  <script>
    class SoundFX {
      constructor() {
        this.ctx = null;
        this.muted = false;
      }
      init() {
        if (!this.ctx) {
          const AudioContext = window.AudioContext || window.webkitAudioContext;
          this.ctx = new AudioContext();
        }
        if (this.ctx && this.ctx.state === 'suspended') {
          this.ctx.resume();
        }
      }
      playPaperRustle() {
        if (this.muted) return;
        this.init();
        try {
          const bufferSize = this.ctx.sampleRate * 0.08;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.3));
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 1400;
          filter.Q.value = 1.2;
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.08, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.08);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start();
        } catch(e){}
      }
      playStampThud() {
        if (this.muted) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(140, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(30, this.ctx.currentTime + 0.09);
          gain.gain.setValueAtTime(0.24, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.09);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.1);
        } catch(e){}
      }
      playFlipSwoosh() {
        if (this.muted) return;
        this.init();
        try {
          const osc = this.ctx.createOscillator();
          const gain = this.ctx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(300, this.ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(90, this.ctx.currentTime + 0.12);
          gain.gain.setValueAtTime(0.12, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.12);
          osc.connect(gain);
          gain.connect(this.ctx.destination);
          osc.start();
          osc.stop(this.ctx.currentTime + 0.13);
        } catch(e){}
      }
      playCrumple() {
        if (this.muted) return;
        this.init();
        try {
          const bufferSize = this.ctx.sampleRate * 0.18;
          const buffer = this.ctx.createBuffer(1, bufferSize, this.ctx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.pow(1 - (i / bufferSize), 1.5);
          }
          const noise = this.ctx.createBufferSource();
          noise.buffer = buffer;
          const filter = this.ctx.createBiquadFilter();
          filter.type = 'highpass';
          filter.frequency.value = 750;
          const gain = this.ctx.createGain();
          gain.gain.setValueAtTime(0.16, this.ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, this.ctx.currentTime + 0.18);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(this.ctx.destination);
          noise.start();
        } catch(e){}
      }
    }
    const sound = new SoundFX();
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
    import { getAuth, signInAnonymously, signInWithCustomToken } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
    import { 
      getFirestore, 
      collection, 
      doc, 
      setDoc, 
      updateDoc, 
      deleteDoc,
      onSnapshot 
    } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

    const CANVAS_SIZE = 6000;
    const POST_COOLDOWN_SECONDS = 30;
    const AGE_DECAY_THRESHOLD_MS = 48 * 60 * 60 * 1000;

    const COLORS = [
      { id: 'yellow', name: 'Canary', bg: '#fef08a', text: '#18181b', border: '#eab308' },
      { id: 'mint',   name: 'Mint',   bg: '#dcfce7', text: '#14532d', border: '#86efac' },
      { id: 'rose',   name: 'Rose',   bg: '#ffe4e6', text: '#881337', border: '#fda4af' },
      { id: 'cyan',   name: 'Sky',    bg: '#e0f2fe', text: '#0c4a6e', border: '#7dd3fc' },
      { id: 'chalk',  name: 'Chalk',  bg: '#f5f5f5', text: '#171717', border: '#d4d4d4' },
      { id: 'carbon', name: 'Carbon', bg: '#1c1917', text: '#e7e5e4', border: '#44403c' }
    ];

    const STAMPS = [
      { text: 'SAME', color: '#dc2626' },
      { text: 'MOOD', color: '#2563eb' },
      { text: 'REAL', color: '#16a34a' },
      { text: 'BULLSHIT', color: '#ea580c' },
      { text: 'WHY', color: '#9333ea' }
    ];

    let selectedColor = COLORS[0];
    let doodleColor = COLORS[0];
    let notes = [];
    let filterQuery = '';

    // Camera State: Pan & Zoom
    let scale = 1.0;
    const MIN_SCALE = 0.35;
    const MAX_SCALE = 2.2;
    let panX = -2200;
    let panY = -2200;

    let isPanningWall = false;
    let panStartX = 0;
    let panStartY = 0;

    // Touch & Gesture state
    let activePointers = new Map();
    let initialPinchDistance = null;
    let initialPinchScale = 1.0;
    let pinchCenter = { x: 0, y: 0 };

    let isRadarVisible = true;
    let cooldownRemaining = 0;
    let cooldownTimer = null;
    let activeReplyNoteId = null;

    let db = null;
    let auth = null;
    let currentUser = null;
    const appId = typeof __app_id !== 'undefined' ? __app_id : 'staring-at-the-wall-v1';

    // DOM Elements
    const wallViewport = document.getElementById('wallViewport');
    const wallSurface = document.getElementById('wallSurface');
    const notesContainer = document.getElementById('notesContainer');
    const stickForm = document.getElementById('stickForm');
    const postInput = document.getElementById('postInput');
    const charCount = document.getElementById('charCount');
    const stickSubmitBtn = document.getElementById('stickSubmitBtn');
    const submitBtnText = document.getElementById('submitBtnText');
    const colorPalette = document.getElementById('colorPalette');
    const audioToggleBtn = document.getElementById('audioToggleBtn');
    const audioIcon = document.getElementById('audioIcon');
    const driftBtn = document.getElementById('driftBtn');
    const toggleRadarBtn = document.getElementById('toggleRadarBtn');
    const filterInput = document.getElementById('filterInput');
    const liveCounter = document.getElementById('liveCounter');
    const emptyOverlay = document.getElementById('emptyOverlay');
    const radarMap = document.getElementById('radarMap');
    const radarBlipsContainer = document.getElementById('radarBlipsContainer');
    const radarCamBox = document.getElementById('radarCamBox');
    const radarNoteCount = document.getElementById('radarNoteCount');
    const zoomInBtn = document.getElementById('zoomInBtn');
    const zoomOutBtn = document.getElementById('zoomOutBtn');
    const zoomResetBtn = document.getElementById('zoomResetBtn');
    const zoomPercentLabel = document.getElementById('zoomPercentLabel');

    // Doodle Elements
    const doodleModal = document.getElementById('doodleModal');
    const toggleDoodleModalBtn = document.getElementById('toggleDoodleModalBtn');
    const closeDoodleModalBtn = document.getElementById('closeDoodleModalBtn');
    const clearDoodleBtn = document.getElementById('clearDoodleBtn');
    const submitDoodleBtn = document.getElementById('submitDoodleBtn');
    const doodleCanvas = document.getElementById('doodleCanvas');
    const doodleCanvasWrapper = document.getElementById('doodleCanvasWrapper');
    const doodleColorPickers = document.getElementById('doodleColorPickers');
    let doodleCtx = doodleCanvas.getContext('2d');
    let isDrawing = false;
    let lastDrawX = 0;
    let lastDrawY = 0;

    function applyTransform(transition = false) {
      if (transition) {
        wallSurface.style.transition = 'transform 0.5s cubic-bezier(0.25, 1, 0.5, 1)';
      } else {
        wallSurface.style.transition = 'none';
      }
      wallSurface.style.transform = `translate3d(${panX}px, ${panY}px, 0) scale(${scale})`;
      zoomPercentLabel.textContent = `${Math.round(scale * 100)}%`;
      updateRadarCamera();
    }

    function setZoom(newScale, focalX, focalY) {
      const clampedScale = Math.min(MAX_SCALE, Math.max(MIN_SCALE, newScale));
      if (clampedScale === scale) return;

      const viewportRect = wallViewport.getBoundingClientRect();
      const originX = focalX !== undefined ? focalX - viewportRect.left : viewportRect.width / 2;
      const originY = focalY !== undefined ? focalY - viewportRect.top : viewportRect.height / 2;

      // Adjust pan so point under cursor/finger stays stationary
      const currentWorldX = (originX - panX) / scale;
      const currentWorldY = (originY - panY) / scale;

      scale = clampedScale;
      panX = originX - (currentWorldX * scale);
      panY = originY - (currentWorldY * scale);

      applyTransform(false);
    }

    function centerWall(animated = false) {
      const vw = wallViewport.clientWidth;
      const vh = wallViewport.clientHeight;
      scale = 1.0;
      panX = -(CANVAS_SIZE / 2 - vw / 2);
      panY = -(CANVAS_SIZE / 2 - vh / 2);
      applyTransform(animated);
    }

    // Zoom Buttons
    zoomInBtn.addEventListener('click', () => {
      sound.playPaperRustle();
      setZoom(scale * 1.25);
    });
    zoomOutBtn.addEventListener('click', () => {
      sound.playPaperRustle();
      setZoom(scale / 1.25);
    });
    zoomResetBtn.addEventListener('click', () => {
      sound.playPaperRustle();
      centerWall(true);
    });

    // Wheel Zoom
    wallViewport.addEventListener('wheel', (e) => {
      e.preventDefault();
      const zoomFactor = e.deltaY < 0 ? 1.12 : 0.89;
      setZoom(scale * zoomFactor, e.clientX, e.clientY);
    }, { passive: false });

    // Sound Toggle
    audioToggleBtn.addEventListener('click', () => {
      sound.muted = !sound.muted;
      audioIcon.textContent = sound.muted ? '🔇' : '🔊';
      if (!sound.muted) sound.playPaperRustle();
    });

    // Toggle radar for small screens
    toggleRadarBtn.addEventListener('click', () => {
      isRadarVisible = !isRadarVisible;
      radarMap.style.transform = isRadarVisible ? 'scale(1)' : 'scale(0)';
      radarMap.style.pointerEvents = isRadarVisible ? 'auto' : 'none';
      toggleRadarBtn.classList.toggle('text-white', isRadarVisible);
    });

    function getDistance(p1, p2) {
      const dx = p1.clientX - p2.clientX;
      const dy = p1.clientY - p2.clientY;
      return Math.sqrt(dx * dx + dy * dy);
    }

    function getCenter(p1, p2) {
      return {
        x: (p1.clientX + p2.clientX) / 2,
        y: (p1.clientY + p2.clientY) / 2
      };
    }

    function setupGestureHandling() {
      wallViewport.addEventListener('pointerdown', (e) => {
        if (e.target.closest('.note-wrapper') || e.target.closest('button') || e.target.closest('input') || e.target.closest('#radarMap') || e.target.closest('#doodleModal')) {
          return;
        }

        activePointers.set(e.pointerId, e);

        if (activePointers.size === 1) {
          isPanningWall = true;
          wallSurface.style.transition = 'none';
          wallViewport.classList.add('panning');
          panStartX = e.clientX - panX;
          panStartY = e.clientY - panY;
        } else if (activePointers.size === 2) {
          isPanningWall = false;
          wallViewport.classList.remove('panning');
          const [p1, p2] = Array.from(activePointers.values());
          initialPinchDistance = getDistance(p1, p2);
          initialPinchScale = scale;
          pinchCenter = getCenter(p1, p2);
        }
      });

      window.addEventListener('pointermove', (e) => {
        if (!activePointers.has(e.pointerId)) return;
        activePointers.set(e.pointerId, e);

        if (activePointers.size === 1 && isPanningWall) {
          panX = e.clientX - panStartX;
          panY = e.clientY - panStartY;
          applyTransform(false);
        } else if (activePointers.size === 2 && initialPinchDistance) {
          const [p1, p2] = Array.from(activePointers.values());
          const curDist = getDistance(p1, p2);
          const ratio = curDist / initialPinchDistance;
          const center = getCenter(p1, p2);
          setZoom(initialPinchScale * ratio, center.x, center.y);
        }
      });

      const onPointerEnd = (e) => {
        activePointers.delete(e.pointerId);
        if (activePointers.size < 2) {
          initialPinchDistance = null;
        }
        if (activePointers.size === 1) {
          const remaining = Array.from(activePointers.values())[0];
          isPanningWall = true;
          panStartX = remaining.clientX - panX;
          panStartY = remaining.clientY - panY;
        } else if (activePointers.size === 0) {
          isPanningWall = false;
          wallViewport.classList.remove('panning');
        }
      };

      window.addEventListener('pointerup', onPointerEnd);
      window.addEventListener('pointercancel', onPointerEnd);
    }

    function updateRadarCamera() {
      const vw = wallViewport.clientWidth;
      const vh = wallViewport.clientHeight;
      const radarSize = 144; // 36 tailwind unit is 9rem = 144px
      const scaleToRadar = radarSize / CANVAS_SIZE;

      // Viewport dimensions in canvas world units
      const worldVw = vw / scale;
      const worldVh = vh / scale;
      const worldCamX = -panX / scale;
      const worldCamY = -panY / scale;

      const camBoxX = worldCamX * scaleToRadar;
      const camBoxY = worldCamY * scaleToRadar;
      const camBoxW = worldVw * scaleToRadar;
      const camBoxH = worldVh * scaleToRadar;

      radarCamBox.style.left = `${Math.max(0, camBoxX)}px`;
      radarCamBox.style.top = `${Math.max(0, camBoxY)}px`;
      radarCamBox.style.width = `${Math.min(radarSize, camBoxW)}px`;
      radarCamBox.style.height = `${Math.min(radarSize, camBoxH)}px`;
    }

    function renderRadarBlips() {
      radarBlipsContainer.innerHTML = '';
      const radarSize = 144;
      const scaleToRadar = radarSize / CANVAS_SIZE;

      radarNoteCount.textContent = `${notes.length} note${notes.length === 1 ? '' : 's'}`;

      notes.forEach(n => {
        const blip = document.createElement('div');
        blip.className = 'radar-blip';
        blip.style.left = `${(n.x + 130) * scaleToRadar}px`;
        blip.style.top = `${(n.y + 100) * scaleToRadar}px`;
        blip.style.backgroundColor = n.faceDown ? '#525252' : (n.color?.bg || '#fef08a');
        blip.style.boxShadow = `0 0 5px ${n.faceDown ? '#262626' : (n.color?.bg || '#fef08a')}`;
        radarBlipsContainer.appendChild(blip);
      });
    }

    // Direct Radar Map Navigation (Touch and Click)
    function handleRadarJump(clientX, clientY) {
      const rect = radarMap.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const clickY = clientY - rect.top;
      const ratioX = clickX / rect.width;
      const ratioY = clickY / rect.height;

      const targetWorldX = ratioX * CANVAS_SIZE;
      const targetWorldY = ratioY * CANVAS_SIZE;

      const vw = wallViewport.clientWidth;
      const vh = wallViewport.clientHeight;

      panX = -(targetWorldX * scale - vw / 2);
      panY = -(targetWorldY * scale - vh / 2);

      applyTransform(true);
      sound.playPaperRustle();
    }

    radarMap.addEventListener('click', (e) => {
      handleRadarJump(e.clientX, e.clientY);
    });
    radarMap.addEventListener('touchend', (e) => {
      if (e.changedTouches && e.changedTouches[0]) {
        handleRadarJump(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
      }
    });

    filterInput.addEventListener('input', () => {
      filterQuery = filterInput.value.toLowerCase().trim();
      renderNotes();
    });

    driftBtn.addEventListener('click', () => {
      if (notes.length === 0) return;
      sound.playPaperRustle();
      const target = notes[Math.floor(Math.random() * notes.length)];
      const vw = wallViewport.clientWidth;
      const vh = wallViewport.clientHeight;
      panX = -((target.x + 130) * scale - vw / 2);
      panY = -((target.y + 100) * scale - vh / 2);
      applyTransform(true);
    });

    function startCooldown(seconds) {
      cooldownRemaining = seconds;
      stickSubmitBtn.disabled = true;
      postInput.disabled = true;

      clearInterval(cooldownTimer);
      cooldownTimer = setInterval(() => {
        cooldownRemaining--;
        if (cooldownRemaining <= 0) {
          clearInterval(cooldownTimer);
          stickSubmitBtn.disabled = false;
          postInput.disabled = false;
          submitBtnText.textContent = 'Stick';
        } else {
          submitBtnText.textContent = `${cooldownRemaining}s`;
        }
      }, 1000);
    }

    function renderPalette() {
      colorPalette.innerHTML = '';
      COLORS.forEach(c => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.title = c.name;
        dot.style.backgroundColor = c.bg;
        dot.className = `w-4 h-4 rounded-full border transition ${
          selectedColor.id === c.id ? 'scale-125 border-white ring-1 ring-white/50' : 'border-neutral-700 opacity-60 hover:opacity-100'
        }`;
        dot.onclick = () => {
          selectedColor = c;
          renderPalette();
          sound.playPaperRustle();
        };
        colorPalette.appendChild(dot);
      });
    }

    function renderNotes() {
      notesContainer.innerHTML = '';
      renderRadarBlips();
      updateRadarCamera();

      const filtered = notes.filter(n => {
        if (!filterQuery) return true;
        const textMatch = n.text && n.text.toLowerCase().includes(filterQuery);
        const replyMatch = n.replies && n.replies.some(r => r.text.toLowerCase().includes(filterQuery));
        return textMatch || replyMatch;
      });

      if (notes.length === 0) {
        emptyOverlay.classList.remove('hidden');
        emptyOverlay.classList.add('flex');
        return;
      }
      emptyOverlay.classList.add('hidden');
      emptyOverlay.classList.remove('flex');

      const now = Date.now();

      filtered.forEach(note => {
        const wrapper = document.createElement('div');
        const color = note.color || COLORS[0];
        const isFacedown = Boolean(note.faceDown);

        const age = now - (note.createdAt || now);
        const hasInteractions = (note.stamps?.length > 0) || (note.replies?.length > 0);
        let opacityVal = 1;
        if (age > AGE_DECAY_THRESHOLD_MS && !hasInteractions) {
          const decayRatio = Math.min(1, (age - AGE_DECAY_THRESHOLD_MS) / (72 * 60 * 60 * 1000));
          opacityVal = Math.max(0.48, 1 - (decayRatio * 0.52));
        }

        wrapper.id = `note-${note.id}`;
        wrapper.className = `note-wrapper absolute select-none w-64 sm:w-72`;
        wrapper.style.left = `${note.x}px`;
        wrapper.style.top = `${note.y}px`;
        wrapper.style.opacity = opacityVal;

        const tilt = note.tilt || 0;
        const stampList = note.stamps || [];
        const replyList = note.replies || [];

        wrapper.innerHTML = `
          <div class="sticky-note p-4 sm:p-5 rounded-sm flex flex-col justify-between text-black ${note.folded ? 'folded' : ''} ${isFacedown ? 'is-facedown' : ''}" style="background-color: ${color.bg}; color: ${color.text}; border-top: 1px solid ${color.border || '#cbd5e1'}; transform: rotate(${tilt}deg);">
            
            <!-- Front Face -->
            <div class="note-front flex flex-col justify-between h-full">
              <div class="flex items-center justify-between opacity-50 text-[10px] pb-2 border-b border-black/10 select-none">
                <span class="font-mono">${formatDate(note.createdAt || now)}</span>
                <div class="flex items-center gap-2">
                  <button class="flip-btn hover:text-black hover:opacity-100 p-0.5 tracking-tight font-mono text-[9px]" title="Turn face down">[flip]</button>
                  <button class="crumple-btn hover:text-black hover:opacity-100 p-0.5" title="Crumple into the bin">✕</button>
                </div>
              </div>

              <!-- Note Content: text or hand-drawn doodle -->
              ${note.isDoodle && note.doodleData ? `
                <div class="py-2 flex justify-center">
                  <img src="${note.doodleData}" alt="Doodle" class="max-w-full h-auto pointer-events-none drop-shadow-sm select-none" />
                </div>
              ` : `
                <div class="py-2.5 font-normal text-sm sm:text-base leading-snug break-words tracking-tight whitespace-pre-wrap handwriting select-text cursor-auto">
                  ${escapeHtml(note.text)}
                </div>
              `}

              <!-- Stamps -->
              <div class="flex flex-wrap gap-1.5 my-1.5 min-h-[16px]">
                ${renderStampBadges(stampList)}
              </div>

              <!-- Replies / Scribbles -->
              ${replyList.length > 0 ? `
                <div class="replies-box max-h-28 overflow-y-auto space-y-1.5 pt-2 mt-1 border-t border-black/10 font-mono text-[11px]">
                  ${replyList.map(r => `
                    <div class="bg-black/5 rounded px-2 py-1 leading-tight break-words">
                      <span class="opacity-40 text-[9px] mr-1">↳</span>${escapeHtml(r.text)}
                    </div>
                  `).join('')}
                </div>
              ` : ''}

              <!-- Bottom Actions -->
              <div class="pt-3 mt-2 border-t border-black/10 flex items-center justify-between text-[11px] font-mono">
                <div class="relative stamp-dropdown">
                  <button class="stamp-menu-btn opacity-60 hover:opacity-100 hover:font-bold flex items-center gap-1 transition">
                    <span>[stamp]</span>
                  </button>
                  <div class="stamp-menu hidden absolute bottom-6 left-0 bg-neutral-900 border border-neutral-800 shadow-2xl rounded p-1.5 flex gap-1 z-50">
                    ${STAMPS.map(s => `
                      <button data-stamp="${s.text}" class="stamp-opt text-[10px] font-bold px-2 py-1 rounded hover:bg-neutral-800 transition tracking-wider" style="color: ${s.color};">
                        ${s.text}
                      </button>
                    `).join('')}
                  </div>
                </div>

                <button class="reply-toggle-btn opacity-60 hover:opacity-100 transition">
                  + scribble
                </button>
              </div>

              <!-- Inline scribble form -->
              <div class="reply-form-wrap ${activeReplyNoteId === note.id ? 'block' : 'hidden'} mt-2 pt-2 border-t border-black/10">
                <form class="reply-form flex gap-1">
                  <input 
                    type="text" 
                    maxlength="120" 
                    placeholder="write in margins..." 
                    class="reply-input flex-1 bg-black/10 border border-black/20 text-xs px-2 py-1 rounded placeholder-black/40 focus:outline-none focus:border-black/50 font-mono text-[16px] sm:text-xs"
                  />
                  <button type="submit" class="bg-black/80 text-white text-[10px] px-2.5 py-1 rounded hover:bg-black font-mono">
                    Add
                  </button>
                </form>
              </div>
            </div>

            <!-- Face Down Back -->
            <div class="note-back absolute inset-0 p-4 rounded-sm flex flex-col items-center justify-center text-center cursor-pointer bg-neutral-900 text-neutral-500 border border-neutral-800" title="Turn face up">
              <span class="text-xs font-mono opacity-50 tracking-widest uppercase mb-1">Face Down</span>
              <span class="text-[10px] text-neutral-600 font-mono">[tap to reveal note]</span>
            </div>

            <div class="folded-corner" title="Double-click to fold"></div>
          </div>
        `;

        attachNoteEvents(wrapper, note);
        setupCardDrag(wrapper, note);
        notesContainer.appendChild(wrapper);
      });
    }

    function renderStampBadges(stampList) {
      if (!stampList || stampList.length === 0) return '';
      const grouped = {};
      stampList.forEach(s => {
        grouped[s.text] = (grouped[s.text] || 0) + 1;
      });

      return Object.entries(grouped).map(([stampName, count]) => {
        const stampDef = STAMPS.find(s => s.text === stampName) || STAMPS[0];
        const rot = ((stampName.charCodeAt(0) * 7) % 15) - 7;
        return `
          <span 
            class="ink-stamp stamp-font text-[10px] font-bold px-1.5 py-0.2 rounded border" 
            style="border-color: ${stampDef.color}; color: ${stampDef.color}; --rot: ${rot}deg; transform: rotate(${rot}deg);"
          >
            ${stampName} ${count > 1 ? `×${count}` : ''}
          </span>
        `;
      }).join('');
    }

    function attachNoteEvents(wrapper, note) {
      const stickyEl = wrapper.querySelector('.sticky-note');

      // Crumple Action
      const crumpleBtn = wrapper.querySelector('.crumple-btn');
      crumpleBtn.onclick = (e) => {
        e.stopPropagation();
        sound.playCrumple();
        wrapper.classList.add('crumpling');
        setTimeout(() => deleteNote(note.id), 300);
      };

      // Flip face-down
      const flipBtn = wrapper.querySelector('.flip-btn');
      const noteBack = wrapper.querySelector('.note-back');
      const toggleFlip = (e) => {
        e.stopPropagation();
        note.faceDown = !note.faceDown;
        sound.playFlipSwoosh();
        stickyEl.classList.toggle('is-facedown', note.faceDown);
        renderRadarBlips();
        persistNoteUpdate(note.id, { faceDown: note.faceDown });
      };

      flipBtn.onclick = toggleFlip;
      noteBack.onclick = toggleFlip;

      // Fold Corner
      const foldCorner = wrapper.querySelector('.folded-corner');
      foldCorner.ondblclick = (e) => {
        e.stopPropagation();
        note.folded = !note.folded;
        stickyEl.classList.toggle('folded', note.folded);
        sound.playPaperRustle();
        persistNoteUpdate(note.id, { folded: note.folded });
      };

      // Stamp Menu
      const stampMenuBtn = wrapper.querySelector('.stamp-menu-btn');
      const stampMenu = wrapper.querySelector('.stamp-menu');
      stampMenuBtn.onclick = (e) => {
        e.stopPropagation();
        const isOpen = !stampMenu.classList.contains('hidden');
        document.querySelectorAll('.stamp-menu').forEach(m => m.classList.add('hidden'));
        if (!isOpen) stampMenu.classList.remove('hidden');
      };

      const stampOpts = wrapper.querySelectorAll('.stamp-opt');
      stampOpts.forEach(btn => {
        btn.onclick = (e) => {
          e.stopPropagation();
          const stampText = btn.dataset.stamp;
          stampMenu.classList.add('hidden');
          addStampToNote(note, stampText);
        };
      });

      // Reply Toggle
      const replyToggleBtn = wrapper.querySelector('.reply-toggle-btn');
      const replyWrap = wrapper.querySelector('.reply-form-wrap');
      const replyInput = wrapper.querySelector('.reply-input');
      replyToggleBtn.onclick = (e) => {
        e.stopPropagation();
        const isHidden = replyWrap.classList.contains('hidden');
        if (isHidden) {
          activeReplyNoteId = note.id;
          replyWrap.classList.remove('hidden');
          setTimeout(() => replyInput.focus(), 60);
        } else {
          activeReplyNoteId = null;
          replyWrap.classList.add('hidden');
        }
      };

      const replyForm = wrapper.querySelector('.reply-form');
      replyForm.onsubmit = (e) => {
        e.preventDefault();
        const text = replyInput.value.trim();
        if (!text) return;
        sound.playPaperRustle();
        addReplyToNote(note, text);
        replyInput.value = '';
        activeReplyNoteId = null;
      };
    }

    async function addStampToNote(note, stampText) {
      sound.playStampThud();
      if (!note.stamps) note.stamps = [];
      note.stamps.push({
        text: stampText,
        stampedAt: Date.now()
      });
      renderNotes();
      persistNoteUpdate(note.id, { stamps: note.stamps });
    }

    async function addReplyToNote(note, replyText) {
      if (!note.replies) note.replies = [];
      note.replies.push({
        id: 'rep_' + Date.now(),
        text: replyText,
        time: Date.now()
      });
      renderNotes();
      persistNoteUpdate(note.id, { replies: note.replies });
    }

    function setupCardDrag(wrapper, note) {
      let isDragging = false;
      let startX = 0, startY = 0;
      let initialLeft = note.x, initialTop = note.y;
      let moved = false;

      const onPointerDown = (e) => {
        if (e.target.closest('button') || e.target.closest('input') || e.target.closest('form') || e.target.closest('.replies-box') || e.target.closest('.note-back') || e.target.classList.contains('handwriting')) {
          return;
        }

        e.stopPropagation();
        isDragging = true;
        moved = false;
        wrapper.classList.add('dragging');
        sound.playPaperRustle();

        startX = e.clientX;
        startY = e.clientY;
        initialLeft = parseFloat(wrapper.style.left) || note.x;
        initialTop = parseFloat(wrapper.style.top) || note.y;

        const onPointerMove = (moveEvt) => {
          if (!isDragging) return;
          const dx = (moveEvt.clientX - startX) / scale;
          const dy = (moveEvt.clientY - startY) / scale;

          if (Math.abs(dx) > 3 || Math.abs(dy) > 3) moved = true;

          const nextX = Math.max(10, Math.min(CANVAS_SIZE - 320, initialLeft + dx));
          const nextY = Math.max(10, Math.min(CANVAS_SIZE - 320, initialTop + dy));

          wrapper.style.left = `${nextX}px`;
          wrapper.style.top = `${nextY}px`;
        };

        const onPointerUp = () => {
          if (!isDragging) return;
          isDragging = false;
          wrapper.classList.remove('dragging');
          window.removeEventListener('pointermove', onPointerMove);
          window.removeEventListener('pointerup', onPointerUp);

          if (moved) {
            sound.playPaperRustle();
            const finalX = Math.round(parseFloat(wrapper.style.left));
            const finalY = Math.round(parseFloat(wrapper.style.top));
            note.x = finalX;
            note.y = finalY;
            renderRadarBlips();
            persistNoteUpdate(note.id, { x: finalX, y: finalY });
          }
        };

        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
      };

      wrapper.addEventListener('pointerdown', onPointerDown);
    }

    function setupDoodleModal() {
      // Setup palette for doodle paper
      doodleColorPickers.innerHTML = '';
      COLORS.forEach(c => {
        const dot = document.createElement('button');
        dot.type = 'button';
        dot.style.backgroundColor = c.bg;
        dot.className = `w-4 h-4 rounded-full border ${doodleColor.id === c.id ? 'border-white ring-1 ring-white/50' : 'border-neutral-700'}`;
        dot.onclick = () => {
          doodleColor = c;
          doodleCanvasWrapper.style.backgroundColor = c.bg;
          setupDoodleModal();
        };
        doodleColorPickers.appendChild(dot);
      });

      toggleDoodleModalBtn.onclick = () => {
        doodleModal.classList.remove('hidden');
        doodleModal.classList.add('flex');
        clearDoodle();
      };

      closeDoodleModalBtn.onclick = () => {
        doodleModal.classList.add('hidden');
        doodleModal.classList.remove('flex');
      };

      clearDoodleBtn.onclick = () => {
        clearDoodle();
      };

      function clearDoodle() {
        doodleCtx.clearRect(0, 0, doodleCanvas.width, doodleCanvas.height);
      }

      function getDoodlePos(e) {
        const rect = doodleCanvas.getBoundingClientRect();
        return {
          x: e.clientX - rect.left,
          y: e.clientY - rect.top
        };
      }

      doodleCanvas.addEventListener('pointerdown', (e) => {
        isDrawing = true;
        const pos = getDoodlePos(e);
        lastDrawX = pos.x;
        lastDrawY = pos.y;
        doodleCtx.beginPath();
        doodleCtx.moveTo(lastDrawX, lastDrawY);
      });

      doodleCanvas.addEventListener('pointermove', (e) => {
        if (!isDrawing) return;
        const pos = getDoodlePos(e);
        doodleCtx.strokeStyle = '#18181b';
        doodleCtx.lineWidth = 2.5;
        doodleCtx.lineCap = 'round';
        doodleCtx.lineJoin = 'round';
        doodleCtx.lineTo(pos.x, pos.y);
        doodleCtx.stroke();
        lastDrawX = pos.x;
        lastDrawY = pos.y;
      });

      const stopDrawing = () => {
        isDrawing = false;
      };
      window.addEventListener('pointerup', stopDrawing);

      submitDoodleBtn.onclick = () => {
        const dataUrl = doodleCanvas.toDataURL('image/png');
        createNote({
          isDoodle: true,
          doodleData: dataUrl,
          text: '[doodle sketch]',
          color: doodleColor
        });
        doodleModal.classList.add('hidden');
        doodleModal.classList.remove('flex');
      };
    }

    function createNote({ text, isDoodle = false, doodleData = null, color = selectedColor }) {
      sound.playStampThud();

      const vw = wallViewport.clientWidth;
      const vh = wallViewport.clientHeight;
      const visibleCenterX = (-panX + (vw / 2)) / scale - 140;
      const visibleCenterY = (-panY + (vh / 2)) / scale - 100;

      const jitterX = (Math.random() - 0.5) * 160;
      const jitterY = (Math.random() - 0.5) * 120;
      const tilt = Math.floor(Math.random() * 9) - 4;

      const id = 'note_' + Date.now() + '_' + Math.random().toString(36).substring(2, 6);
      const newNote = {
        id,
        text,
        isDoodle,
        doodleData,
        color,
        x: Math.round(visibleCenterX + jitterX),
        y: Math.round(visibleCenterY + jitterY),
        tilt,
        folded: false,
        faceDown: false,
        stamps: [],
        replies: [],
        createdAt: Date.now()
      };

      notes.unshift(newNote);
      renderNotes();
      startCooldown(POST_COOLDOWN_SECONDS);

      if (db && currentUser) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'wall_notes', id);
          setDoc(docRef, newNote);
        } catch (err) {
          saveLocalNotes();
        }
      } else {
        saveLocalNotes();
      }
    }

    stickForm.addEventListener('submit', (e) => {
      e.preventDefault();
      if (cooldownRemaining > 0) return;
      const text = postInput.value.trim();
      if (!text) return;

      createNote({ text });
      postInput.value = '';
      charCount.textContent = '240';
    });

    postInput.addEventListener('input', () => {
      charCount.textContent = 240 - postInput.value.length;
    });

    async function persistNoteUpdate(noteId, payload) {
      if (db && currentUser) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'wall_notes', noteId);
          await updateDoc(docRef, payload);
          return;
        } catch (err) {
          console.warn("Firestore update fallback:", err);
        }
      }
      saveLocalNotes();
    }

    async function deleteNote(noteId) {
      notes = notes.filter(n => n.id !== noteId);
      renderNotes();

      if (db && currentUser) {
        try {
          const docRef = doc(db, 'artifacts', appId, 'public', 'data', 'wall_notes', noteId);
          await deleteDoc(docRef);
          return;
        } catch (err) {
          console.warn("Firestore delete fallback:", err);
        }
      }
      saveLocalNotes();
    }

    function saveLocalNotes() {
      try {
        localStorage.setItem(`staring_wall_notes_${appId}`, JSON.stringify(notes));
      } catch (e) {}
    }

    function loadLocalNotes() {
      try {
        const stored = localStorage.getItem(`staring_wall_notes_${appId}`);
        if (stored) return JSON.parse(stored);
      } catch (e) {}
      return [];
    }

    async function initFirestore() {
      if (typeof __firebase_config === 'undefined') {
        initFallback();
        return;
      }

      try {
        const config = JSON.parse(__firebase_config);
        const app = initializeApp(config);
        db = getFirestore(app);
        auth = getAuth(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        } else {
          await signInAnonymously(auth);
        }

        currentUser = auth.currentUser;
        if (!currentUser) throw new Error("Auth failed");

        const notesCol = collection(db, 'artifacts', appId, 'public', 'data', 'wall_notes');
        
        onSnapshot(notesCol, (snapshot) => {
          const list = [];
          snapshot.forEach(docSnap => {
            list.push({ id: docSnap.id, ...docSnap.data() });
          });

          list.sort((a, b) => (b.createdAt || 0) - (a.createdAt || 0));
          notes = list;
          renderNotes();
        }, (err) => {
          console.error("Firestore subscription error:", err);
          initFallback();
        });

      } catch (err) {
        console.warn("Firestore initialization error, using local fallback:", err);
        initFallback();
      }
    }

    function initFallback() {
      const local = loadLocalNotes();
      notes = Array.isArray(local) ? local : [];
      renderNotes();
    }

    function escapeHtml(str) {
      if (!str) return '';
      return String(str).replace(/[&<>'"]/g, tag => ({
        '&': '&amp;',
        '<': '&lt;',
        '>': '&gt;',
        "'": '&#39;',
        '"': '&quot;'
      }[tag] || tag));
    }

    function formatDate(ms) {
      const s = Math.floor((Date.now() - ms) / 1000);
      if (s < 60) return 'just now';
      if (s < 3600) return `${Math.floor(s / 60)}m ago`;
      if (s < 86400) return `${Math.floor(s / 3600)}h ago`;
      return `${Math.floor(s / 86400)}d ago`;
    }

    function initLivePresence() {
      let count = 3 + Math.floor(Math.random() * 4);
      liveCounter.textContent = `${count} staring`;
      setInterval(() => {
        const delta = Math.random() > 0.5 ? 1 : -1;
        count = Math.max(2, count + (Math.random() > 0.7 ? delta : 0));
        liveCounter.textContent = `${count} staring`;
      }, 7500);
    }

    window.addEventListener('click', (e) => {
      if (!e.target.closest('.stamp-dropdown')) {
        document.querySelectorAll('.stamp-menu').forEach(m => m.classList.add('hidden'));
      }
    });

    window.addEventListener('resize', () => {
      updateRadarCamera();
    });

    window.onload = () => {
      renderPalette();
      centerWall(false);
      setupGestureHandling();
      setupDoodleModal();
      initLivePresence();
      initFirestore();
    };
  </script>
</body>
</html>
